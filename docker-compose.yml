name: db-design-practice

services:
  mysql:
    image: mysql:8.4
    container_name: practice-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-practice}
    command:
      - --local-infile=1
      # Empty = LOAD DATA INFILE may read any path, e.g. the book's CSVs at /book (Chapter 3+).
      # Fine for a local practice box; never do this on a real server.
      - --secure-file-priv=
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./book-repo:/book:ro
      - .:/workspace:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-practice}"]
      interval: 5s
      timeout: 3s
      retries: 30

  postgres:
    image: postgres:17
    container_name: practice-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-practice}
    command:
      - postgres
      # Query statistics extension used in the performance chapters
      - -c
      - shared_preload_libraries=pg_stat_statements
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./book-repo:/book:ro
      - .:/workspace:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Optional browser GUI for PostgreSQL: docker compose --profile gui up -d
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: practice-pgadmin
    profiles: ["gui"]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-practice}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - postgres

volumes:
  mysql-data:
  postgres-data:
  pgadmin-data:
